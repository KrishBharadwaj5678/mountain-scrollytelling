<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <title>Scrolling Mountain Animation</title>
</head>
<body>

  <div class="w-full bg-zinc-900">
    <div class="parent relative top-0 left-0 w-full h-[700vh]">
        <div class="w-full sticky top-0 left-0 h-screen">
           <canvas class="w-full h-screen" id="frame"></canvas>
        </div>
    </div>     
  </div>
  
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" integrity="sha512-7eHRwcbYkK4d9g/6tD/mhkf++eoTHwpNM9woBxtPUBWm67zeAfFC+HrdoE2GanKeocly/VxeLvIqwvCdk7qScg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js" integrity="sha512-onMTRKJBKz8M1TnqqDuGBlowlH0ohFzMXYRNebz+yOcc5TQr/zAKsthzhuv0hiyUKEiQEQXEynnXCvNTOk50dg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script>

  let canvas=document.querySelector('canvas');
  let context=canvas.getContext('2d');

  let frames={
    currentIndex:0,
    maxIndex:727
  }

  let imageLoaded=0;
  let images=[];

  // Preload Images
  function preloadImages(){
    for(let i=1;frames.maxIndex>=i;i++){

        // Folder Containing Images
        let imageURL= `./frames/frame_${i.toString().padStart(4,"0")}.jpg`;

        // Setting the image source in image tag
        let img=new Image();
        img.src=imageURL;

        // Loading the Images
        img.onload=()=>{
          imageLoaded++;
          // If all images are loaded then run this
          if(imageLoaded===frames.maxIndex){
              loadImages(frames.currentIndex);
              startAnimation();
          }
        }
        images.push(img);

    } 
  }

  // Load Images
  function loadImages(index){
      if(index>=0 && index<=frames.maxIndex){
          let img=images[index];
          canvas.width=window.innerWidth;
          canvas.height=window.innerHeight;

          let scaleX=canvas.width/img.width;
          let scaleY=canvas.height/img.height;
          let scale=Math.max(scaleX,scaleY);

          let newWidth=img.width*scaleX;
          let newHeight=img.height*scaleY;

          let offsetX=(canvas.width-newWidth)/2;
          let offsetY=(canvas.height-newHeight  )/2;

          context.clearRect(0,0,canvas.width,canvas.height);
          context.imageSmoothingEnabled=true;
          context.imageSmoothingQuality="high";
          context.drawImage(img,offsetX,offsetY,newWidth,newHeight);
          frames.currentIndex=index;
      }
    }

    // Start Animation
    function startAnimation(){
      let t1=gsap.timeline({
        scrollTrigger:{
            trigger:".parent",
            start:"top top",
            scrub:2
        }
      })

      t1.to(frames,{
        currentIndex:frames.maxIndex,
        onUpdate:function(){
            loadImages(Math.floor(frames.currentIndex))
        }
      })
    }

  preloadImages();

</script>
</body>
</html>
